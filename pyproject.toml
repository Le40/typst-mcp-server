
[project]
name = "typst-mcp-server"
version = "0.1.0"
description = "Configurable MCP server for AI-assisted Typst document generation"
requires-python = ">=3.14"
dependencies = [
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "tools", "config"]


# Path to the Typst project, relative to this MCP server.
project_root = "../my-typst-project"

# Directory for generated PDFs, relative to project_root.
output_dir = "output"

# READ PERMISSIONS
# Directories ending with "/" include their subdirectories.
# Individual files can also be specified.
# Each location defines its allowed file extensions.

[permissions.read]
"main.typ" = [".typ"]
"templates/" = [".typ"]
"content/" = [".typ", ".md", ".txt"]
"documents/" = [".typ"]
"inbox/" = [".md", ".txt"]

# CREATE PERMISSIONS
# Only new files can be created; existing files cannot
# be overwritten.

[permissions.create]
"documents/" = [".typ"]
"inbox/" = [".md", ".txt"]


# OPTIONAL CUSTOM EXPORTER
# Uncomment and adapt this section if your project
# has its own document export script.
#
# The script path is relative to project_root.
# The command and arguments depend on your exporter.
#
# [custom_exporter]
# command = ["python"]
# script = "scripts/export.py"
# target_flag = "--document"
# target_description = "Document identifier to export"
#
# [custom_exporter.options.format]
# flag = "--format"
# description = "Choose the export format"
# default = "pdf"
# allowed = ["pdf", "both"]
#
# The exporter must print a line like:
# EXPORT_RESULT={"files":["output/report.pdf"]}
#
# All reported files must exist inside output_dir.
